name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate GitHub workflow expressions
        shell: bash
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - run: python3 -m pip install -r scripts/requirements-validation.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned Claude validator
        run: npm install --global @anthropic-ai/claude-code@2.1.308
      - name: Report validator versions
        run: |
          python3 --version
          python3 -m pip show PyYAML
          claude --version
      - name: Test validation and Git hooks
        run: python3 -m unittest discover -s tests -v
      - name: Validate the checkout against its event baseline
        run: ./scripts/check-ci.sh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_CREATED: ${{ github.event.created }}

  notify-plugin-releases:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: notify-plugin-releases
      cancel-in-progress: false
    steps:
      # A queued run must publish the main branch as it exists when the job
      # starts, rather than the older commit that originally triggered it.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/publish_plugin_releases.py
        env:
          JOURNAL_MCP_PLUGIN_RELEASE_SECRET: ${{ secrets.JOURNAL_MCP_PLUGIN_RELEASE_SECRET }}

  tag-plugin-releases:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - notify-plugin-releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-plugin-releases
      cancel-in-progress: false
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Each push tags the versions its own commit carries, at that commit:
      # a queued run must not tag a later bump at a later head and leave
      # the version in between without a tag.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned Claude CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.308
      # `claude plugin tag` is the only thing that creates a release tag: it
      # derives the name and version from plugin.json and gets the separator
      # right. A version already tagged on origin is skipped, so re-running
      # the job or a push that bumps nothing creates nothing.
      - name: Tag the plugin releases missing on origin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin=$(dirname "$(dirname "$manifest")")
            tag="$(jq -r .name "$manifest")--v$(jq -r .version "$manifest")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists on origin."
              continue
            fi
            claude plugin tag "$plugin" --push
          done
