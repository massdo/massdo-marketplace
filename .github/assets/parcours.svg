<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="title desc">
  <title id="title">A task’s journey with nestor-beta</title>
  <desc id="desc">A board game: your idea, then spec turns it into tasks, build turns a task into a pull request, ship merges it into main, and doctor closes the shipped tasks. A shortcut when you do not know what to do next: next-tasks finds the project through Git, or takes the project you name, lists its tasks to do now, and joins the path before build.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", Times, serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .trail { animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .trail { animation: none; } }
  </style>
  <defs></defs>
  <rect width="1200" height="450" rx="28" fill="#F0EEE6"/>
  <path class="trail" d="M120 140 C200 70 280 70 360 140 S520 210 600 140 S760 70 840 140 S1000 210 1080 140" fill="none" stroke="#3D3D3A" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <path class="trail" d="M330 344 H416" fill="none" stroke="#3D3D3A" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <path class="trail" d="M480 290 V200" fill="none" stroke="#3D3D3A" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <rect x="74.2" y="38.0" width="91.5" height="28.0" rx="14.0" fill="#FAF9F5" stroke="#141413" stroke-width="1.5"/><text x="120" y="56.5" font-size="13" fill="#141413" font-weight="700" text-anchor="middle" letter-spacing="2">START</text>
  <path d="M1080 96 V30" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
  <rect x="1080" y="30" width="44" height="28" fill="#FAF9F5" stroke="#141413" stroke-width="2"/>
  <g fill="#141413"><rect x="1080" y="30" width="11" height="14"/><rect x="1102" y="30" width="11" height="14"/><rect x="1091" y="44" width="11" height="14"/><rect x="1113" y="44" width="11" height="14"/></g>
  <circle cx="120" cy="140" r="44" fill="#D4A27F" stroke="#141413" stroke-width="2.5"/><text x="120" y="154" font-size="38" fill="#141413" font-weight="600" text-anchor="middle">1</text>
  <text x="120" y="228" font-size="26" fill="#141413" class="serif" text-anchor="middle">your idea</text>
  <text x="120" y="258" font-size="18" fill="#5E5D59" text-anchor="middle">you tell it</text>
  <circle cx="360" cy="140" r="44" fill="#D97757" stroke="#141413" stroke-width="2.5"/><text x="360" y="154" font-size="38" fill="#141413" font-weight="600" text-anchor="middle">2</text>
  <text x="360" y="228" font-size="26" fill="#141413" class="mono" font-weight="600" text-anchor="middle">spec</text>
  <text x="360" y="258" font-size="18" fill="#5E5D59" text-anchor="middle">it becomes tasks</text>
  <circle cx="600" cy="140" r="44" fill="#BCD1CA" stroke="#141413" stroke-width="2.5"/><text x="600" y="154" font-size="38" fill="#141413" font-weight="600" text-anchor="middle">3</text>
  <text x="600" y="228" font-size="26" fill="#141413" class="mono" font-weight="600" text-anchor="middle">build</text>
  <text x="600" y="258" font-size="18" fill="#5E5D59" text-anchor="middle">a task becomes a PR</text>
  <circle cx="840" cy="140" r="44" fill="#6A9BCC" stroke="#141413" stroke-width="2.5"/><text x="840" y="154" font-size="38" fill="#141413" font-weight="600" text-anchor="middle">4</text>
  <text x="840" y="228" font-size="26" fill="#141413" class="mono" font-weight="600" text-anchor="middle">ship</text>
  <text x="840" y="258" font-size="18" fill="#5E5D59" text-anchor="middle">the PR lands in main</text>
  <circle cx="1080" cy="140" r="44" fill="#CBCADB" stroke="#141413" stroke-width="2.5"/><text x="1080" y="154" font-size="38" fill="#141413" font-weight="600" text-anchor="middle">5</text>
  <text x="1080" y="228" font-size="26" fill="#141413" class="mono" font-weight="600" text-anchor="middle">doctor</text>
  <text x="1080" y="258" font-size="18" fill="#5E5D59" text-anchor="middle">done tasks close</text>
  <rect x="76.1" y="330.0" width="239.8" height="28.0" rx="14.0" fill="#FAF9F5" stroke="#141413" stroke-width="1.5"/><text x="196" y="348.6" font-size="13" fill="#141413" font-weight="700" text-anchor="middle" letter-spacing="2">WHAT DO I DO NEXT?</text>
  <circle cx="480" cy="344" r="44" fill="#C46686" stroke="#141413" stroke-width="2.5"/><text x="480" y="358" font-size="38" fill="#141413" font-weight="600" text-anchor="middle">2</text>
  <text x="548" y="326" font-size="26" fill="#141413" class="mono" font-weight="600">next-tasks</text>
  <text x="548" y="360" font-size="18" fill="#5E5D59">in a repo, it finds your project through Git</text>
  <text x="548" y="388" font-size="18" fill="#5E5D59">anywhere else, name it: lisbon-trip, kitchen-works…</text>
  <text x="548" y="416" font-size="18" fill="#5E5D59">it lists the tasks to do now, then you build one</text>
</svg>
