<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to search nestor</title>
  <desc id="desc">Story: planning a trip to Lisbon. First, semantic search: the question 'where did I want to eat?' finds 'dinner spots in Alfama', 'table at Ramiro, Friday' and 'pastry list for Belem', no word in common, closest first. Then deterministic search: the tag @@lisbon with the todo filter lists every task tagged lisbon, the same list every time.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", Times, serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .trail { animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .trail { animation: none; } }
  </style>
  <defs></defs>
  <rect width="1200" height="520" rx="28" fill="#F0EEE6"/>
  <text x="600" y="74" font-size="38" fill="#141413" class="serif" text-anchor="middle">Planning a trip to Lisbon</text>
  <text x="600" y="108" font-size="19" fill="#5E5D59" text-anchor="middle">First ask in your own words, then narrow down with a tag.</text>
  <rect x="40" y="140" width="540" height="340" rx="18" fill="#FAF9F5" stroke="#D1CFC5" stroke-width="1.5"/>
  <circle cx="74" cy="178" r="17" fill="#D97757"/>
  <text x="74" y="185" font-size="18" fill="#FAF9F5" font-weight="700" text-anchor="middle">1</text>
  <text x="102" y="187" font-size="26" fill="#141413" class="serif">Semantic</text>
  <rect x="385.2" y="164.0" width="170.8" height="28.0" rx="14.0" fill="none" stroke="#D1CFC5" stroke-width="1.5"/><text x="470.6" y="182.9" font-size="14" fill="#5E5D59" class="mono" font-weight="500" text-anchor="middle">ask in your words</text>
  <line x1="40" y1="214" x2="580" y2="214" stroke="#D1CFC5" stroke-width="1.5"/>
  <text x="72" y="256" font-size="20" fill="#141413" class="mono">› where did I want to eat?</text>
  <rect x="392" y="238" width="11" height="23" fill="#D97757"/>
  <text x="72" y="304" font-size="18" fill="#141413">dinner spots in Alfama</text>
  <rect x="370" y="292" width="178" height="10" rx="5" fill="#E8E6DC"/>
  <rect x="370" y="292" width="178" height="10" rx="5" fill="#D97757"/>
  <text x="72" y="348" font-size="18" fill="#141413">table at Ramiro, Friday</text>
  <rect x="370" y="336" width="178" height="10" rx="5" fill="#E8E6DC"/>
  <rect x="370" y="336" width="139" height="10" rx="5" fill="#D97757"/>
  <text x="72" y="392" font-size="18" fill="#141413">pastry list for Belem</text>
  <rect x="370" y="380" width="178" height="10" rx="5" fill="#E8E6DC"/>
  <rect x="370" y="380" width="100" height="10" rx="5" fill="#D97757"/>
  <text x="72" y="440" font-size="15" fill="#5E5D59">No word in common, same idea:</text>
  <text x="72" y="462" font-size="15" fill="#5E5D59">the closest come first.</text>
  <path d="M594 298 l12 12 l-12 12" fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="620" y="140" width="540" height="340" rx="18" fill="#FAF9F5" stroke="#D1CFC5" stroke-width="1.5"/>
  <circle cx="654" cy="178" r="17" fill="#6A9BCC"/>
  <text x="654" y="185" font-size="18" fill="#FAF9F5" font-weight="700" text-anchor="middle">2</text>
  <text x="682" y="187" font-size="26" fill="#141413" class="serif">Deterministic</text>
  <rect x="998.8" y="164.0" width="137.2" height="28.0" rx="14.0" fill="none" stroke="#D1CFC5" stroke-width="1.5"/><text x="1067.4" y="182.9" font-size="14" fill="#5E5D59" class="mono" font-weight="500" text-anchor="middle">filter by tag</text>
  <line x1="620" y1="214" x2="1160" y2="214" stroke="#D1CFC5" stroke-width="1.5"/>
  <text x="652" y="256" font-size="20" fill="#141413" class="mono">›</text>
  <rect x="673.2" y="232.0" width="105.6" height="34.0" rx="17.0" fill="#EBDBBC" stroke="#D4A27F" stroke-width="1.5"/><text x="726" y="254.9" font-size="17" fill="#141413" class="mono" font-weight="600" text-anchor="middle">@@lisbon</text>
  <rect x="810.0" y="234.0" width="64.0" height="30.0" rx="15.0" fill="none" stroke="#6A9BCC" stroke-width="1.5"/><text x="842" y="254.2" font-size="15" fill="#3D3D3A" class="mono" font-weight="500" text-anchor="middle">todo</text>
  <rect x="652" y="287" width="20" height="20" rx="5" fill="none" stroke="#141413" stroke-width="2"/>
  <text x="686" y="304" font-size="18" fill="#141413">book the hotel</text>
  <rect x="1058.6" y="285.0" width="70.8" height="26.0" rx="13.0" fill="#EBDBBC"/><text x="1094" y="302.6" font-size="13" fill="#3D3D3A" class="mono" font-weight="500" text-anchor="middle">lisbon</text>
  <rect x="652" y="331" width="20" height="20" rx="5" fill="none" stroke="#141413" stroke-width="2"/>
  <text x="686" y="348" font-size="18" fill="#141413">buy a metro card</text>
  <rect x="1058.6" y="329.0" width="70.8" height="26.0" rx="13.0" fill="#EBDBBC"/><text x="1094" y="346.6" font-size="13" fill="#3D3D3A" class="mono" font-weight="500" text-anchor="middle">lisbon</text>
  <rect x="652" y="375" width="20" height="20" rx="5" fill="none" stroke="#141413" stroke-width="2"/>
  <text x="686" y="392" font-size="18" fill="#141413">table at Ramiro</text>
  <rect x="1058.6" y="373.0" width="70.8" height="26.0" rx="13.0" fill="#EBDBBC"/><text x="1094" y="390.6" font-size="13" fill="#3D3D3A" class="mono" font-weight="500" text-anchor="middle">lisbon</text>
  <text x="652" y="440" font-size="15" fill="#5E5D59">Every todo tagged lisbon,</text>
  <text x="652" y="462" font-size="15" fill="#5E5D59">the same list every time.</text>
</svg>
