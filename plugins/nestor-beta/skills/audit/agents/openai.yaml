interface:
  display_name: "Nestor Audit"
  short_description: "Audit a Plan, Task or PR with an independent Codex or Claude agent"
  default_prompt: "Use $nestor-beta:audit <plan-or-task-id-or-slug|pr-number> [cli] [codex|claude] [model] [effort] to have an independent subagent audit it, or add cli to run the Codex or Claude CLI instead, such as cli codex sol best max; a Plan or Task report is logged in a linked Nestor note."

policy:
  allow_implicit_invocation: true
