interface:
  display_name: "Ship"
  short_description: "Propose the next PR action for main; details on request"
  default_prompt: "Use $nestor-beta:ship to propose the next action on open pull requests, such as what to merge into main, with the details on request, and follow the repository's release procedure, asking me before each merge or release step."

policy:
  allow_implicit_invocation: false
