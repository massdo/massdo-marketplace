interface:
  display_name: "Nestor Resume"
  short_description: "Explicitly restore and archive a project's handoff"
  default_prompt: "Use $nestor-beta:resume [project] only on my explicit request to restore this project's saved context and archive its handoff without starting work."

dependencies:
  tools:
    - type: "mcp"
      value: "nestor"
      description: "Nestor journal MCP server, provided by the nestor plugin"
      transport: "streamable_http"
      url: "https://journal.mcp-marketplace.org/mcp"

policy:
  allow_implicit_invocation: false
