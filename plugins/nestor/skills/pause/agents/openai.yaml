interface:
  display_name: "Nestor Pause"
  short_description: "Save this chat's context for later"
  default_prompt: "Use $nestor:pause to save this conversation's context. Detect the project automatically."

dependencies:
  tools:
    - type: "mcp"
      value: "nestor"
      description: "Canonical MCP server for the Nestor journal"
      transport: "streamable_http"
      url: "https://journal.mcp-marketplace.org/mcp"

policy:
  allow_implicit_invocation: false
