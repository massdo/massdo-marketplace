interface:
  display_name: "Nestor Resume"
  short_description: "Explicitly restore a transmission without mutation"
  default_prompt: "Use $nestor:resume to restore saved context without starting work. Detect the project automatically."

dependencies:
  tools:
    - type: "mcp"
      value: "nestor"
      description: "Canonical MCP server for the Nestor journal"
      transport: "streamable_http"
      url: "https://journal.mcp-marketplace.org/mcp"

policy:
  allow_implicit_invocation: false
