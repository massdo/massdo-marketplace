interface:
  display_name: "Nestor Resume"
  short_description: "Explicitly restore a transmission without mutation"
  default_prompt: "Use $nestor:resume [project] only on my explicit request to restore this chat's saved transmission, or explicitly choose one with list, without mutation or starting work."

dependencies:
  tools:
    - type: "mcp"
      value: "nestor"
      description: "Canonical MCP server for the Nestor journal"
      transport: "streamable_http"
      url: "https://journal.mcp-marketplace.org/mcp"

policy:
  allow_implicit_invocation: false
