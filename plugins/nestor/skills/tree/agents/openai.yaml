interface:
  display_name: "Nestor Tree"
  short_description: "See a Nestor project as an ASCII tree"
  default_prompt: "Use $tree to show the shape of my project."

dependencies:
  tools:
    - type: "mcp"
      value: "nestor"
      description: "Canonical MCP server for the Nestor journal"
      transport: "streamable_http"
      url: "https://journal.mcp-marketplace.org/mcp"

policy:
  allow_implicit_invocation: true
