interface:
  display_name: "Nestor Tree"
  short_description: "See a Nestor project as an ASCII tree — $nestor:tree [project] [view] [level]"
  default_prompt: "Use $nestor:tree [project] [view] [level] — or project:x view:y level:n item:id — to show the shape of my project."

dependencies:
  tools:
    - type: "mcp"
      value: "nestor"
      description: "Canonical MCP server for the Nestor journal"
      transport: "streamable_http"
      url: "https://journal.mcp-marketplace.org/mcp"

policy:
  allow_implicit_invocation: true
