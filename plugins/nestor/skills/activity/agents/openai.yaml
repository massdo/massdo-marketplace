interface:
  display_name: "Nestor Activity"
  short_description: "Track and report time by activity — $nestor:activity start <name> | stop | report [period]"
  default_prompt: "Use $nestor:activity start <name> | switch <name> | stop | report [period] | repair to track my activity time."

dependencies:
  tools:
    - type: "mcp"
      value: "nestor"
      description: "Canonical MCP server for the Nestor journal"
      transport: "streamable_http"
      url: "https://journal.mcp-marketplace.org/mcp"

policy:
  allow_implicit_invocation: true
